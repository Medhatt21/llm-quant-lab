# =============================================================================
# CUDA-specific overrides (use with: docker compose -f docker-compose.yml -f docker-compose.cuda.yml up)
# =============================================================================
services:
  app:
    build:
      dockerfile: docker/Dockerfile.app-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}

  vllm:
    build:
      context: .
      dockerfile: docker/Dockerfile.vllm-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
