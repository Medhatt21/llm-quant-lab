# LLM-Quant-Lab experiment 2571
# Auto-generated from reproduction_results.csv by scripts/generate_configs.py.
# Method: RTN, model: meta-llama/Llama-2-7b-hf, bit width: 4
#
# Run inside the dev container:
#   cd /workspace/vendors/lightcompress
#   python -m llmc --config /workspace/experiments/configs/2571.yml --task_id 0

base:
    seed: &seed 42
model:
    type: Llama
    path: meta-llama/Llama-2-7b-hf
    torch_dtype: auto
calib:
    name: wikitext2
    download: True
    n_samples: 128
    bs: 1
    seq_len: 2048
    preproc: wikitext2_gptq
    seed: *seed
eval:
    eval_pos: [pretrain, fake_quant]
    name: wikitext2
    download: True
    bs: 1
    seq_len: 2048
    inference_per_block: False
quant:
    method: RTN
    weight:
        bit: 4
        symmetric: False
        granularity: per_group
        group_size: 128
    quant_out: True
save:
    save_fake: False
    save_path: /workspace/.local/models/2571-rtn-w4
