# IISWC #414 modern-model characterization: SmoothQuant W8A8 on a 2025 dense
# model (dense control for the MoE SmoothQuant case).
base:
    seed: &seed 42
model:
    type: Qwen3
    path: Qwen/Qwen3-32B
    torch_dtype: auto
calib:
    name: pileval
    download: True
    n_samples: 128
    bs: 1
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [pretrain, fake_quant]
    name: wikitext2
    download: True
    bs: 1
    seq_len: 2048
    inference_per_block: False
quant:
    method: SmoothQuant
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
    act:
        bit: 8
        symmetric: True
        granularity: per_token
    special:
        alpha: 0.5
save:
    save_trans: False
    save_fake: False
