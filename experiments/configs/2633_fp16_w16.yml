# LLM-Quant-Lab experiment 2633
# Auto-generated from reproduction_results.csv by scripts/generate_configs.py.
# Method: FP16, model: facebook/opt-iml-30b, bit width: 16
#
# Run inside the dev container:
#   cd /workspace/vendors/lightcompress
#   python -m llmc --config /workspace/experiments/configs/2633.yml --task_id 0

base:
    seed: &seed 42
model:
    type: Opt
    path: facebook/opt-iml-30b
    torch_dtype: auto
calib:
    name: wikitext2
    download: True
    n_samples: 128
    bs: 1
    seq_len: 2048
    preproc: wikitext2_gptq
    seed: *seed
eval:
    eval_pos: [pretrain]
    name: wikitext2
    download: True
    bs: 1
    seq_len: 2048
    inference_per_block: False
save:
    save_fake: False
    save_path: /workspace/.local/models/2633-fp16-w16
