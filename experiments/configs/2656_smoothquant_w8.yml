# LLM-Quant-Lab experiment 2656
# Auto-generated from reproduction_results.csv by scripts/generate_configs.py.
# Method: SMOOTHQUANT, model: facebook/opt-iml-30b, bit width: 8
#
# Run inside the dev container:
#   cd /workspace/vendors/lightcompress
#   python -m llmc --config /workspace/experiments/configs/2656.yml --task_id 0

base:
    seed: &seed 42
model:
    type: Opt
    path: facebook/opt-iml-30b
    torch_dtype: auto
calib:
    name: pileval
    download: True
    n_samples: 512
    bs: 1
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [pretrain, fake_quant]
    name: wikitext2
    download: True
    bs: 1
    seq_len: 2048
    inference_per_block: False
quant:
    method: SmoothQuant
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
    act:
        bit: 8
        symmetric: True
        granularity: per_token
    special:
        alpha: 0.5
save:
    save_trans: False
    save_fake: False
    save_path: /workspace/.local/models/2656-smoothquant-w8
