# LLM-Quant-Lab experiment 2534
# Auto-generated from reproduction_results.csv by scripts/generate_configs.py.
# Method: GPTQ, model: facebook/opt-125m, bit width: 3
#
# Run inside the dev container:
#   cd /workspace/vendors/lightcompress
#   python -m llmc --config /workspace/experiments/configs/2534.yml --task_id 0

base:
    seed: &seed 42
model:
    type: Opt
    path: facebook/opt-125m
    torch_dtype: auto
calib:
    name: wikitext2
    download: True
    n_samples: 128
    bs: 1
    seq_len: 2048
    preproc: wikitext2_gptq
    seed: *seed
eval:
    eval_pos: [pretrain, fake_quant]
    name: wikitext2
    download: True
    bs: 1
    seq_len: 2048
    inference_per_block: False
quant:
    method: GPTQ
    weight:
        bit: 3
        symmetric: False
        granularity: per_group
        group_size: 128
    special:
        actorder: True
        static_groups: False
        percdamp: 0.01
        blocksize: 128
        true_sequential: True
    quant_out: True
save:
    save_fake: False
    save_path: /workspace/.local/models/2534-gptq-w3
