# IISWC #414 modern-model characterization: SmoothQuant W8A8 on a 2025 MoE.
# Pairs a REAL WikiText-2 perplexity (pretrain vs fake_quant) with the router
# probe flip-rate diagnostic on the same model (reports/moe_probe/qwen3_moe_sq.json).
base:
    seed: &seed 42
model:
    type: Qwen3Moe
    path: qwen/Qwen3-30B-A3B
    torch_dtype: auto
calib:
    name: pileval
    download: True
    n_samples: 128
    bs: 1
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [pretrain, fake_quant]
    name: wikitext2
    download: True
    bs: 1
    seq_len: 2048
    inference_per_block: False
quant:
    method: SmoothQuant
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
    act:
        bit: 8
        symmetric: True
        granularity: per_token
    special:
        alpha: 0.5
save:
    save_trans: False
    save_fake: False
