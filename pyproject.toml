[project]
name = "llm-quant-lab"
version = "0.1.0"
description = "LLM Quantization Research OS - A framework for LLM quantization experiments on top of LightCompress/LLMC (ROCm/AMD GPU)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "LLM Quant Lab Team" }
]
keywords = ["llm", "quantization", "compression", "machine-learning", "deep-learning", "rocm", "amd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML - ROCm PyTorch from pytorch-rocm index
    "torch>=2.5.0",
    "pytorch-triton-rocm>=3.5.0; sys_platform == 'linux'",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    
    # Data validation and CLI
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    
    # Data processing and visualization
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    
    # HTTP client for scientist LLM
    "httpx>=0.25.0",
    
    # API server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Configuration
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    
    # Evaluation metrics
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    
    # Tokenizers (for calibration)
    "sentencepiece>=0.1.99",
    "protobuf>=4.0.0",
    
    # LightCompress (LLMC) dependencies - LLMC itself is cloned to vendors/
    # See: https://github.com/ModelTC/LightCompress/blob/main/requirements.txt
    "easydict>=1.10",
    "omegaconf>=2.3.0",
    "texttable>=1.6.0",
    "toml>=0.10.0",
    "func_timeout>=4.3.0",
    "tokenizers>=0.13.0",
    
    # Downstream task evaluation
    "lm-eval>=0.4.0",
    
    # Experiment tracking
    "wandb>=0.16.0",
    
    # Jupyter notebooks
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "nbformat>=5.9.0",
    "tqdm>=4.65.0",
    
    # Additional visualization
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
# API-only dependencies (for lightweight API container)
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
llm-quant = "src.main:app"

[project.urls]
Homepage = "https://github.com/your-org/llm-quant-lab"
Documentation = "https://github.com/your-org/llm-quant-lab#readme"
Repository = "https://github.com/your-org/llm-quant-lab"
Issues = "https://github.com/your-org/llm-quant-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# UV Configuration for ROCm
# ============================================================================

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.uv]
native-tls = true

# ROCm index for PyTorch packages only (explicit = true means only used when specified in sources)
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

# Force torch and triton from ROCm index
[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

# Override torch dependencies to remove NVIDIA CUDA packages
[[tool.uv.dependency-metadata]]
name = "torch"
requires-dist = [
    "filelock",
    "typing-extensions>=4.10.0",
    "networkx",
    "jinja2",
    "fsspec",
    "sympy>=1.13.3",
    "pytorch-triton-rocm==3.5.1; sys_platform == 'linux'",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hatch
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
